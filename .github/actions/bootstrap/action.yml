# The bootstrap of every job of session-store: .github/workflows/ci.yml and release.yml run it after their checkout with
# `uses: ./.github/actions/bootstrap`. It installs the locked kit package, whose utilities the Makefile runs, then the
# mise of config/toolchain.json, the node and the npm of mise.toml into var/tools, and the packages of package-lock.json
# with that npm.
name: bootstrap
description: Sets up the Node.js of mise.toml, installs the locked kit package, then the node and npm of var/tools and the packages.
runs:
  using: composite
  steps:
    # actions/setup-node v7.1.0: the Node.js of mise.toml starts make bootstrap and the bootstrap of kit, which installs
    # that release into var/tools with mise; the recipes then run the node of var/tools. The npm of devEngines installs
    # the packages, so the cache of setup-node is off.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    - name: install the locked kit package
      shell: bash
      run: make bootstrap
    - name: install the node and the npm of mise.toml
      shell: bash
      run: make install-tools TOOLS=npm
    - name: install the locked packages
      shell: bash
      run: make install-packages
