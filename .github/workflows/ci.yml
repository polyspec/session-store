# CI of session-store: one workflow whose every job runs one recipe of the Makefile, make ci-<job>, which installs what the
# job needs and then runs its checks (CI_SHARED, CI_RUST and CI_BINDINGS of the Makefile, and make test) past failures,
# with the report of ci-targets as an artifact; a local run is the same call. The other steps of a job provision the
# runner or upload its report. The last job
# ci-passed passes only when every other job succeeded. The release workflow releases the commit whose run of this
# workflow succeeded. The job assets calls .github/workflows/assets.yml, which builds the assets of each platform of the
# bindings as a release does, so that an asset that does not build stops the release before a tag exists.
#
# The job test runs make test: bay runs the Redis servers of its tests on Docker from the image that REDIS_IMAGE of the
# Makefile pins by its digest, the same image that it runs on Apple container on a development machine (SE-10.4). The
# action .github/actions/bay installs the pinned release of bay and applies its machine setup, once per runner, before the
# run step; no recipe applies it, and the run fails naming `bay install` on a machine without it.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The checks of the repository: the documents and the checklist, the rules of the workflows and the classification of
  # the manifests for the release.
  shared:
    runs-on: ubuntu-26.04-arm
    steps:
      # actions/checkout v7.0.1: with the whole history, which the checks of the documents read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - name: shared checks
        run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint of the crates of the library, clippy with the lints of the workspace and rustfmt, and the contract check of
  # binding with the comparison of the tracked binding packages.
  rust:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: lint and contract check
        run: make ci-rust
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-rust
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The tests of the crates of the library, the stores of Redis against real Redis servers (SE-10.4): PHP reads the
  # records back, make redis-image pulls the pinned image with bay, and make test owns the servers of its run.
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which reads the records of the tests back (SE-10.3).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      # bay of the release that config/toolchain.json pins, on PATH, with its machine setup.
      - uses: ./.github/actions/bay
      # The Rust toolchain and the pinned Redis image, then make test.
      - name: tests
        run: make ci-test

  # The tests of the bindings of every target of the contract (binding BD-27): clippy on the workspace, the generated
  # declarations, and the tests that binding generates with the contract cases of each binding on the runner of its
  # language (make ci-bindings, CI_BINDINGS of the Makefile), so that no binding package is released untested. The job
  # installs every tool of mise.toml, the PHP of .php-version, the PHPUnit of composer.lock and, as the job test does, the
  # pinned Redis image in its recipe ci-bindings, after the action bay: the generated tests of
  # PHP, Python, Node and Go run the cases of the Redis service against a server of the image that each test target
  # starts and removes (SE-10.7).
  bindings:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.40.0: the PHP of .php-version with its php-config, which the PHP extension is built
      # against and which loads it.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      # bay of the release that config/toolchain.json pins, on PATH, with its machine setup.
      - uses: ./.github/actions/bay
      - name: tests of the bindings
        run: make ci-bindings
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-bindings
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The assets of each platform of the bindings, built from the commit of the run with the matrix of the release (binding
  # GN-19a, GN-19i).
  assets:
    uses: ./.github/workflows/assets.yml

  # The rehearsal of the Go module of the next release before its tag exists (T1.92): make ci-release-rehearsal reads the
  # version from CHANGELOG.md, and ci-passed needs it, so a release follows only a rehearsal that passed.
  release-rehearsal:
    runs-on: ubuntu-26.04-arm
    steps:
      # actions/checkout v7.0.1: with the whole history, which the rehearsal of the Go module reads (binding traverses the parents).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - name: rehearse the Go module of the next release
        run: make ci-release-rehearsal

  # The result of the run: the job runs after every other job, also after a failed or cancelled one, and make ci-passed
  # passes only when each job of needs has the result success; a skipped job fails it (FAIL_SKIPPED=1). make
  # workflows-test fails this workflow when ci-passed is not its last job or when needs leaves a job out.
  ci-passed:
    if: ${{ always() }}
    needs: [shared, rust, test, bindings, assets, release-rehearsal]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: every job passed
        run: make ci-passed FAIL_SKIPPED=1 RESULTS='${{ toJSON(needs) }}'
