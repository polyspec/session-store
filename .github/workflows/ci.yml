# CI of session-store: one workflow whose jobs run the targets of the Makefile, each job the target that names its list
# (CI_SHARED and CI_RUST of the Makefile), past failures, with the report of ci-targets as an artifact. The last job
# ci-passed passes only when every other job succeeded. The release workflow releases the commit whose run of this
# workflow succeeded.
#
# The job test runs make test: bay runs the Redis servers of its tests on Docker from the image that REDIS_IMAGE of the
# Makefile pins by its digest, the same image that it runs on Apple container on a development machine (SE-10.4). No
# step installs bay yet, so make test fails at its start and names bay.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The checks of the repository: the documents and the checklist, the rules of the workflows and the classification of
  # the manifests for the release.
  shared:
    runs-on: ubuntu-26.04-arm
    steps:
      # actions/checkout v7.0.1: with the whole history, which the checks of the documents read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - name: shared checks
        run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint of the crates of the library, clippy with the lints of the workspace and rustfmt, and the contract check of
  # binding with the comparison of the tracked binding packages.
  rust:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: install the Rust toolchain and the locked crates
        run: make install-rust
      - name: lint and contract check
        run: make ci-rust
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-rust
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The tests of the crates of the library, the stores of Redis against real Redis servers (SE-10.4): PHP reads the
  # records back, make redis-image pulls the pinned image into docker, and make test owns the servers of its run.
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which reads the records of the tests back (SE-10.3).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: install the Rust toolchain and the locked crates
        run: make install-rust
      - name: pull the pinned Redis image
        run: make redis-image
      - name: tests
        run: make test

  # The result of the run: the job runs after every other job, also after a failed or cancelled one, and make ci-passed
  # passes only when each job of needs has the result success; a skipped job fails it (FAIL_SKIPPED=1). make
  # workflows-test fails this workflow when ci-passed is not its last job or when needs leaves a job out.
  ci-passed:
    if: ${{ always() }}
    needs: [shared, rust, test]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed FAIL_SKIPPED=1
