# Release workflow of session-store. Each step runs one target of the Makefile, or of the release recipes that it
# includes (packages/release.mk, which make release-recipes writes with binding), with TAG, vX.Y.Z, from the environment.
#
# The workflow starts by itself when a push run of the workflow ci succeeds on main: it checks out the head_sha of that
# run, and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log,
# which is the tip of its push; a commit whose top version is tagged elsewhere ends with nothing to release, and a top
# version that no run released fails and names its version commit. A dispatch of the workflow with the id of a
# successful run of ci releases the commit of that run. The run is the evidence; the release runs no test again. Its jobs:
#   tag      release-tag requires a completed successful push or dispatch run RUN of ci.yml on main whose commit is on
#            origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated tag vX.Y.Z,
#            or passes for a tag there already; release-tag-output gives the tag and the version to the later jobs, both
#            empty when the run releases nothing, and the later jobs are then skipped
#   assets   assets.yml builds the assets of each platform from the tree of the tag, after the release check of binding
#            (binding GN-19i)
#   release  on the tree of the tag: installs the tools of config/release.json, builds the archive of the Composer
#            package of the PHP extension, creates the GitHub Release of the tag as a draft, downloads the assets of each
#            platform, carries the Go module with its tag packages/go/vX.Y.Z (release-go-module, binding GN-19f), uploads
#            the assets of each platform (release-platform-assets, binding GN-19g) and makes the release public
# A failed step leaves the release a draft and fails the run. The jobs run on ubuntu-26.04-arm but for the platform
# runners of assets.yml, the actions are pinned by commit and no step has a time limit.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful run of ci on main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of ci alone. The concurrency group is the
    # job's, so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry
      # check; a workflow_run checks out the head_sha of its run of ci, never a later main, and a dispatch checks out
      # main, whose kit runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - name: tag the commit of the run of ci
        run: make release-tag ${{ github.event_name == 'workflow_run' && 'AUTO=1' || '' }}
      - id: tag
        name: give the tag to the later jobs
        run: make release-tag-output

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tree of the tag with the whole history, on which release-go-module makes the commit of the Go module, built
      # with the kit and the packages of the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the release
        run: make release-tools
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: build the archives
        run: make release-assets
      - name: create the draft release
        run: make release-publish
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/assets
          merge-multiple: true
      # The Rust toolchain, whose llvm-nm and llvm-size check the libraries, and the locked crates, which binding reads
      # offline; the Go of mise.toml, with which a consumer proves the commit of the Go module, is one of the tools of
      # release-tools.
      - name: install the Rust toolchain and the locked crates
        run: make install-rust
      - name: write the release recipes
        run: make release-recipes
      # binding makes the commit of the Go module with the identity of the Git of the run, which is the actor of the run.
      - name: carry the Go module of the tag
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: make release-go-module
      - name: upload the assets of each platform
        run: make release-platform-assets
      - name: make the release public
        run: make release-undraft
