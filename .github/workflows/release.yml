# Release workflow of session-store. Each step runs one target of the Makefile with TAG, vX.Y.Z, from the environment,
# which release-tag writes.
#
# The workflow starts by itself when a push run of the workflow ci succeeds on main: it checks out the head_sha of that
# run, and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log,
# which is the tip of its push; a commit whose top version is tagged elsewhere ends with nothing to release, and a top
# version that no run released fails and names its version commit. A concurrency group of the job runs one release of
# the repository at a time. A dispatch of the workflow with the id of a successful run of ci releases the commit of that
# run: it tags the commit with the version of the newest section ## X.Y.Z of its change log, creates the GitHub Release
# of the tag as a draft with the archives of the packages of config/release.json, and makes it public. The run is the
# evidence; the release runs no test again. The steps run in order and stop at the first failure:
#   bootstrap         installs the Node.js of .node-version and the locked kit package
#   release-tag       requires a completed successful push or dispatch run RUN of ci.yml on main whose commit is on
#                     origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated tag
#                     vX.Y.Z, or passes for a tag there already, and appends TAG and VERSION to GITHUB_ENV; a tag
#                     pushed with the token of the run starts no run
#   release-checkout  checks out the tag; the bootstrap of the tagged commit follows
#   release-tools     installs the tools that the packages of config/release.json need, none while it names no package
#   release-assets    builds the archive of every package into var/release/assets
#   release-publish   creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-undraft   makes the release public
# A failed step leaves the release a draft and fails the run.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful run of ci on main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    # A workflow_run starts the release for a successful push or dispatch run of ci alone. The concurrency group is the
    # job's, so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry
      # check; a workflow_run checks out the head_sha of its run of ci, never a later main, and a dispatch checks out
      # main, whose kit runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - name: tag the commit of the run of ci
        run: make release-tag ${{ github.event_name == 'workflow_run' && 'AUTO=1' || '' }}
      # The release builds the tagged commit with its own kit and packages.
      - name: check out the tag
        if: ${{ env.TAG != '' }}
        run: make release-checkout
      - uses: ./.github/actions/bootstrap
        if: ${{ env.TAG != '' }}
      - name: install the tools of the release
        if: ${{ env.TAG != '' }}
        run: make release-tools
      - name: build the assets
        if: ${{ env.TAG != '' }}
        run: make release-assets
      - name: create the draft release
        if: ${{ env.TAG != '' }}
        run: make release-publish
      - name: make the release public
        if: ${{ env.TAG != '' }}
        run: make release-undraft
