# Release workflow of session-store. Each job runs its recipe ci-release-<job> of the Makefile in one run step (T1.35),
# which runs the targets of the Makefile and of the release recipes that it includes (packages/release.mk, which make
# release-recipes writes with binding), with TAG, vX.Y.Z, from the outputs of the job tag.
#
# The workflow starts by itself when a push run of the workflow ci succeeds on main: it checks out the head_sha of that
# run, and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log,
# which is the tip of its push; a commit whose top version is tagged elsewhere ends with nothing to release, and a top
# version that no run released fails and names its version commit. A dispatch of the workflow with the id of a
# successful run of ci releases the commit of that run. The run is the evidence; the release runs no test again. Its jobs:
#   tag      ci-release-tag: release-tag requires a completed successful push or dispatch run RUN of ci.yml on main whose
#            commit is on origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated
#            tag vX.Y.Z, or passes for a tag there already; release-tag-output gives the tag and the version to the later
#            jobs, both empty when the run releases nothing, and the later jobs are then skipped
#   assets   assets.yml builds the assets of each platform from the tree of the tag, after the release check of binding
#            (binding GN-19i)
#   release  ci-release-release on the tree of the tag: installs the tools of config/release.json, builds the archive of
#            the Composer package of the PHP extension, creates the GitHub Release of the tag as a draft, adds the
#            downloaded assets of each platform, carries the Go module with its tag packages/go/vX.Y.Z (release-go-module,
#            binding GN-19f), uploads the assets of each platform (release-platform-assets, binding GN-19g) and makes the
#            release public
# A failed line leaves the release a draft and fails the run. The jobs run on ubuntu-26.04-arm but for the platform
# runners of assets.yml, the actions are pinned by commit, no step has a time limit, and GH_TOKEN, the token of the run,
# is the one environment of a job.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful run of ci on main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of ci alone. The concurrency group is the
    # job's, so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry
      # check; a workflow_run checks out the head_sha of its run of ci, never a later main, and a dispatch checks out
      # main, whose kit runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      # The tag of the commit of the run RUN of ci, given to the later jobs through the outputs of this step.
      - id: tag
        name: tag the commit of the run of ci
        run: make ci-release-tag RUN="${{ inputs.run || github.event.workflow_run.id }}" AUTO="${{ github.event_name == 'workflow_run' && '1' || '' }}"

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tree of the tag with the whole history, on which release-go-module makes the commit of the Go module, built
      # with the kit and the packages of the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: ./.github/actions/bootstrap
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/downloaded, which ci-release-release adds to var/release/assets after the draft release exists.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/downloaded
          merge-multiple: true
      # The recipe ci-release-release: release-tools, then with the tools on PATH release-assets, release-publish, the
      # downloaded assets, the Rust toolchain and the locked crates, whose llvm-nm and llvm-size check the libraries,
      # release-recipes, release-go-module with the identity of the actor of the run, release-platform-assets and
      # release-undraft.
      - name: release the tag
        run: make ci-release-release TAG=${{ needs.tag.outputs.tag }} VERSION=${{ needs.tag.outputs.version }}
