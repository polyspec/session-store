# The workspace of the three crates of sessions (SE-1.3): the store interface and the record (packages/core/rust), the
# store of files (packages/file/rust) and the store of Redis (packages/redis/rust). One Cargo.lock pins them.
[workspace]
resolver = "2"
members = ["packages/core/rust"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
repository = "https://github.com/polyspec/sessions.git"
license = "MIT"
publish = false

# R-1: every warning fails, no unsafe code, no unwrap or expect, no discarded result, no unchecked conversion of a number,
# and every allow attribute names its rule id; clippy.toml disallows the methods that turn an Err or a None into a value.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
