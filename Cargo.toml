# The workspace of session-store (SE-1.3): the crate of the library (packages/rust), which the bindings wrap, and its
# three components: the store interface and the record (packages/core/rust), the store of files (packages/file/rust) and
# the store of Redis (packages/redis/rust); and the binding crates, which binding scaffold writes and whose sources make
# bindings generates (binding design L-2). One Cargo.lock pins them all.
[workspace]
resolver = "2"
members = [
  "packages/rust",
  "packages/core/rust",
  "packages/file/rust",
  "packages/redis/rust",
  "packages/python",
  "packages/ts",
  "packages/ts/wasm",
  "packages/php-ext",
  "packages/go/internal/ffi",
]

[workspace.package]
version = "0.0.6"
edition = "2021"
rust-version = "1.99.0"
repository = "https://github.com/polyspec/session-store.git"
license = "MIT"
publish = false

# R-1: every warning fails, no unsafe code, no unwrap or expect, no discarded result, no unchecked conversion of a number,
# and every allow attribute names its rule id; clippy.toml disallows the methods that turn an Err or a None into a value.
# The binding crates take these lints too (`[lints] workspace = true`, which binding scaffold writes). A binding crate
# allows unsafe code with its reason (binding B-4), which a forbid of the workspace would refuse, so the workspace denies
# it and each crate of the library forbids it in its lib.rs.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
