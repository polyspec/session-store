[package]
name = "polyspec-sessions-core"
description = "The session store interface, session identifiers and the record of a session in the form php_serialize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
include = ["/src/**/*.rs"]

[lib]
name = "polyspec_sessions_core"
path = "src/lib.rs"

[dependencies]
# The random source of the operating system (SE-5.3).
getrandom = "0.3"
# The failure of a call into a store of another language (bindgen design E-1c, SE-3.2) and the kind interface (F-2).
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
# PHP values and their serialize form (SE-1.5, SE-6).
polyspec-php-serialize = { git = "https://github.com/polyspec/php-serialize.git", branch = "v1/rust-core" }

[dev-dependencies]
libtest-mimic = "=0.8.2"
serde_json = "1"

# One trial per case of contracts/sessions.json.
[[test]]
name = "contract"
harness = false

[lints]
workspace = true
