[package]
name = "polyspec-session-store-core"
description = "The session store interface, session identifiers and the record of a session in the form php_serialize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
include = ["/src/**/*.rs"]

[lib]
name = "polyspec_session_store_core"
path = "src/lib.rs"

[features]
# G-5, X-1: compiles the arming of the fault injection points of the module `fault` (SE-9.6); a generated binding crate
# turns it on through polyspec-session-store for its tests only, and no release build has it (binding design 3.6).
fault-test = ["polyspec-binding-core/fault-test"]

[dependencies]
# The random source of the operating system (SE-5.3).
getrandom = "0.3"
# The failure of a call into a store of another language (binding design E-1c, SE-3.2) and the kind interface (F-2).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.3" }
# PHP values and their serialize form (SE-1.5, SE-6).
polyspec-php-serialization = { git = "https://github.com/polyspec/php-serialization.git", branch = "v1/rust-core" }

[dev-dependencies]
# tests/contract.rs arms the fault injection points of the cases that name them, as a generated binding test does. The
# points are judged by the feature fault-test of this crate, which writes them (binding GN-5), so the tests turn it on.
polyspec-session-store-core = { path = ".", features = ["fault-test"] }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.3", features = ["fault-test"] }
libtest-mimic = "=0.8.2"
serde_json = "1"

# One trial per case of contracts/sessions.json.
[[test]]
name = "contract"
harness = false

[lints]
workspace = true
