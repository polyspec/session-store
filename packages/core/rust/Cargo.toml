[package]
name = "polyspec-sessions-core"
description = "The session store interface, session identifiers and the record of a session in the form php_serialize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on the
# crate reads it from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_sessions_core"
path = "src/lib.rs"

[dependencies]
# The random source of the operating system (SE-5.3).
getrandom = "0.3"
# The failure of a call into a store of another language (bindgen design E-1c, SE-3.2) and the kind interface (F-2).
polyspec-bindgen-core = { path = "../../../../bindgen/packages/core/rust" }
# PHP values and their serialize form (SE-1.5, SE-6).
polyspec-php-serialize = { path = "../../../../php-serialize/packages/rust" }

[dev-dependencies]
libtest-mimic = "=0.8.2"
serde_json = "1"

# One trial per case of contracts/sessions.json.
[[test]]
name = "contract"
harness = false

[lints]
workspace = true
