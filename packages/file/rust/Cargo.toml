[package]
name = "polyspec-session-store-file"
description = "The session store of files: one file of the form of the PHP files handler per session, under flock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
include = ["/src/**/*.rs"]

[lib]
name = "polyspec_session_store_file"
path = "src/lib.rs"

[dependencies]
# The wait tokens Io and ProcessWait and the cancellation of a waiting caller (binding design I-2 (4), SF-3.8, SF-8).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.22" }
polyspec-php-serialization = { git = "https://github.com/polyspec/php-serialization.git", tag = "v0.0.16" }
polyspec-session-store-core = { path = "../../core/rust" }
# open with O_NOFOLLOW and O_CLOEXEC, flock, fstat and lstat, futimens (SF-2.4, SF-3, SF-4).
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
# Only generated code makes a wait token; the tests make them through the feature construct. tests/contract.rs arms the
# fault injection points of the cases that name them through the feature fault-test, as a generated binding test does.
# The points are in polyspec-session-store-core and judged by its feature fault-test (binding GN-5).
polyspec-session-store-core = { path = "../../core/rust", features = ["fault-test"] }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.22", features = ["construct", "fault-test"] }
libtest-mimic = "=0.8.2"
serde_json = "1"
tempfile = "3.27.0"

# One trial per case of contracts/file-sessions.json.
[[test]]
name = "contract"
harness = false

[lints]
workspace = true
