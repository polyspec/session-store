[package]
name = "polyspec-session-store-redis"
description = "The session store of Redis: the keys, the lock and the record of the session handler of phpredis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
include = ["/src/**/*.rs"]

[lib]
name = "polyspec_session_store_redis"
path = "src/lib.rs"

[dependencies]
polyspec-php-serialization = { git = "https://github.com/polyspec/php-serialization.git", tag = "v0.0.12" }
polyspec-session-store-core = { path = "../../core/rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.13" }
# The connection (SR-6): a server, Sentinel or Cluster, TLS with rustls, an ACL user and password in the URL.
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "sentinel", "cluster-async"] }
# The cryptography of rustls for TLS (SR-6.1): one provider, ring, so that rustls selects it for the process.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The wait between two tries of a lock and the queue of a process (SR-3.2, SR-8).
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
# tests/contract.rs arms the fault injection points of the cases that name them, as a generated binding test does.
# The points are in polyspec-session-store-core and judged by its feature fault-test (binding GN-5).
polyspec-session-store-core = { path = "../../core/rust", features = ["fault-test"] }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.13", features = ["fault-test"] }
libtest-mimic = "=0.8.2"
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

# One trial per case of contracts/redis-sessions.json, against the model of the commands and against a real server.
[[test]]
name = "contract"
harness = false

[lints]
workspace = true

# The connection against real servers: the queue of a process, ACL, Sentinel, Cluster and TLS (SR-3.2, SR-6).
[[test]]
name = "server"
harness = false
