[package]
name = "polyspec-sessions-redis"
description = "The session store of Redis: the keys, the lock and the record of the session handler of phpredis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_sessions_redis"
path = "src/lib.rs"

[dependencies]
polyspec-php-serialize = { git = "https://github.com/polyspec/php-serialize.git", rev = "389b573573e52a474a07114238d98a95592fa121" }
polyspec-sessions-core = { path = "../../core/rust" }
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", rev = "04f5ed595a40710f81cc0c3242142491fb3d7619" }
# The connection (SR-6): a server, Sentinel or Cluster, TLS with rustls, an ACL user and password in the URL.
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "sentinel", "cluster-async"] }
# The cryptography of rustls for TLS (SR-6.1): one provider, ring, so that rustls selects it for the process.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The wait between two tries of a lock and the queue of a process (SR-3.2, SR-8).
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
libtest-mimic = "=0.8.2"
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

# One trial per case of contracts/redis-sessions.json, against the model of the commands and against a real server.
[[test]]
name = "contract"
harness = false

[lints]
workspace = true

# The connection against real servers: the queue of a process, ACL, TLS and Sentinel (SR-3.2, SR-6).
[[test]]
name = "server"
harness = false
