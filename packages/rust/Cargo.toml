[package]
name = "polyspec-sessions"
description = "The session stores of polyspec: the store interface and the record, and the stores of files and of Redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# The package holds the one interface contract of the bindings of the library beside the source, so that a repository
# that depends on the crate reads it from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_sessions"
path = "src/lib.rs"

[features]
# The bindings of every target build both stores (SE-1.3).
default = ["file", "redis"]
file = ["dep:polyspec-sessions-file"]
redis = ["dep:polyspec-sessions-redis"]

[dependencies]
polyspec-sessions-core = { path = "../core/rust" }
polyspec-sessions-file = { path = "../file/rust", optional = true }
polyspec-sessions-redis = { path = "../redis/rust", optional = true }

[lints]
workspace = true
