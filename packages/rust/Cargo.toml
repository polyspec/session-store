[package]
name = "polyspec-session-store"
description = "The session stores of polyspec: the store interface and the record, and the stores of files and of Redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# The package holds the one interface contract of the bindings of the library beside the source, so that a repository
# that depends on the crate reads it from the package that Cargo resolved (binding design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_session_store"
path = "src/lib.rs"

[features]
# The bindings of every target build both stores (SE-1.3).
default = ["file", "redis"]
file = ["dep:polyspec-session-store-file"]
redis = ["dep:polyspec-session-store-redis"]
# G-5, X-1: the fault injection points of the library (SE-9.6), for the tests of a generated binding crate only.
fault-test = ["polyspec-session-store-core/fault-test"]

[dependencies]
# The PHP values of the contract (php_value, SE-1.5): the binding crates take the dependency of the crate whose
# contract names the types of another library (binding T-3).
polyspec-php-serialization = { git = "https://github.com/polyspec/php-serialization.git", tag = "v0.0.11" }
polyspec-session-store-core = { path = "../core/rust" }
polyspec-session-store-file = { path = "../file/rust", optional = true }
polyspec-session-store-redis = { path = "../redis/rust", optional = true }

[dev-dependencies]
# GN-5: the fault injection points fire in a cargo test without flags, because the tests take the library with the
# feature fault-test.
polyspec-session-store = { path = ".", features = ["fault-test"] }

[lints]
workspace = true
