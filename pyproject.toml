# The private development root of Python (T1.59): no package and no version of the repository. The generated package of
# packages/python requires php-serialization by its name and version alone, and no registry carries it, so this root,
# which installs it for the tests, names the wheel of its release for each platform by the URL of the asset and its
# sha256, as the root package.json names its npm packages. uv.lock locks them, make install-packages installs the lock
# into .venv, which kit links, and make test-python installs the wheel of this checkout there without its dependencies.
[project]
name = "polyspec-session-store-development"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-macosx_11_0_arm64.whl#sha256=48e1860034b4571aca8bab07f8b87175de99b43774f13b24f5f08c487bcf26ed ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=fbac98174b00204ced70a5cddc93ba61057837310900590c715ca8568faa0685 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=3e176082e065fc86e2f4417fd8adaf225184fe9df6c2f6efb5244f90524feb64 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# The root is no package: uv installs its dependencies and builds nothing of it.
[tool.uv]
package = false
