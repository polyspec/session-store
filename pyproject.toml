# The private development root of Python (T1.59): no package and no version of the repository. The generated package of
# packages/python requires php-serialization by its name and version alone, and no registry carries it, so this root,
# which installs it for the tests, names the wheel of its release for each platform by the URL of the asset and its
# sha256, as the root package.json names its npm packages. uv.lock locks them, make install-packages installs the lock
# into .venv, which kit links, and make test-python installs the wheel of this checkout there without its dependencies.
[project]
name = "polyspec-session-store-development"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-macosx_11_0_arm64.whl#sha256=3c23767e1e7eebe2fd6ba15c6974c58290a3160f016022dc540481fba231a51d ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=9a2bb8b6ab99e64db642275cf20f5faccf656192d295684e3ab26e2d360d7637 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=003c6bb350e932f8f9a9769d47110d76f5c81ca1d0bbe2b3e83bf3b19ddf7e9c ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# The root is no package: uv installs its dependencies and builds nothing of it.
[tool.uv]
package = false
